name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      fuzz_time:
        description: Seconds to fuzz each target in the fuzz job
        required: false
        default: "15"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: |
            go.sum
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: |
            go.sum
      - run: go build ./...
      - run: go vet ./...

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: |
            go.sum
      - run: go test -count=1 -race -timeout 15m $(go list ./... | grep -v '/integration')

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: goauth
          POSTGRES_PASSWORD: goauth
          POSTGRES_DB: goauth
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: |
            go.sum
      - run: go test -count=1 -race -timeout 30m ./integration/...
        env:
          GOAUTH_POSTGRES_DSN: postgres://goauth:goauth@localhost:5432/goauth?sslmode=disable

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: |
            go.sum
      - run: go build ./cmd/goauth/...
      - run: go vet ./cmd/goauth/...
      - run: go test -count=1 -race -timeout 5m ./cmd/goauth/...
      # One merged module: a published root tag must install the CLI from
      # outside any checkout. Gate on tag pushes: until the merged release
      # exists, older published versions do not contain cmd/goauth.
      - name: Install CLI from published release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          export GOBIN="$PWD/bin"
          GOWORK=off GOMODCACHE="$(mktemp -d)" go install "github.com/nazimdjebloun/go-auth/cmd/goauth@${GITHUB_REF_NAME}"
          "$GOBIN/goauth" --help >/dev/null
          "$GOBIN/goauth" generate --driver postgres --out pg.schema.sql
          "$GOBIN/goauth" generate --driver mysql --out mysql.schema.sql
          "$GOBIN/goauth" generate --driver sqlite --out sqlite.schema.sql

  mysql-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: goauth-test
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pgoauth-test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: |
            go.sum
      - run: go test -count=1 -timeout 5m -run '^TestApplySchema_MySQL$' ./cmd/goauth/cmd
        env:
          GOAUTH_MYSQL_TEST_DSN: root:goauth-test@tcp(127.0.0.1:3306)/?parseTime=true

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: |
            go.sum
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  fuzz:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FUZZ_BUDGET: ${{ github.event.inputs.fuzz_time || '5' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: |
            go.sum
      - run: |
          set -euo pipefail
          pkgs="domain hasher/argon2id middleware internal/crypto internal/keyring internal/otp internal/schema internal/service emailtemplate token"
          for p in $pkgs; do
            targets="$(go test -list '^Fuzz' "./$p" | grep '^Fuzz' || true)"
            for t in $targets; do
              echo "fuzzing $p:$t (${FUZZ_BUDGET}s)"
              go test -fuzz="^$t$" -fuzztime="${FUZZ_BUDGET}s" -run='^$' "./$p"
            done
          done
