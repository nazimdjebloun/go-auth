<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Your Password</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7;padding:40px 0;">
    <tr>
      <td align="center">
        <table width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background-color:#ffffff;border-radius:8px;overflow:hidden;">
          <tr>
            <td style="padding:40px 48px;">
              <h1 style="margin:0 0 24px;font-size:24px;font-weight:600;color:#1a1a1a;">Set Your Password</h1>
              <p style="margin:0 0 16px;font-size:16px;line-height:24px;color:#4a4a4a;">
                Use the code below to set your password for <strong>{{.AppName}}</strong>.
              </p>
              <table cellpadding="0" cellspacing="0" style="width:100%;margin-bottom:24px;">
                <tr>
                  <td align="center" style="padding:20px;background-color:#f8f8fa;border-radius:6px;border:1px solid #e5e5e5;">
                    <span style="font-size:32px;font-weight:700;color:#1a1a1a;letter-spacing:4px;font-family:'Courier New',Courier,monospace;">{{.Code}}</span>
                  </td>
                </tr>
              </table>
              <p style="margin:0 0 16px;font-size:16px;line-height:24px;color:#4a4a4a;">
                This code expires in <strong>{{formatDuration .ExpiresIn}}</strong>.
              </p>
              <p style="margin:0 0;font-size:14px;line-height:20px;color:#999999;">
                If you did not request to set your password, you can safely ignore this email.
              </p>
            </td>
          </tr>
        </table>
        <p style="margin:24px 0 0;font-size:12px;line-height:16px;color:#999999;">
          {{.AppName}}
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
